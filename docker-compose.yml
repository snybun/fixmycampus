services:
  # ============================================================================
  # Application Service (PHP 8.3 + Apache)
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fixmycampus_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html
    environment:
      APP_NAME: ${APP_NAME:-FixMyCampus}
      APP_TAGLINE: ${APP_TAGLINE:-Report. Track. Improve.}
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_HOST: ${DB_HOST:-database}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-fixmycampus_db}
      DB_USERNAME: ${DB_USERNAME:-fmc_user}
      DB_PASSWORD: ${DB_PASSWORD:-fmc_secure_password_2026}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - fixmycampus_network

  # ============================================================================
  # Database Service (MySQL 8.0)
  # ============================================================================
  database:
    image: mysql:8.0
    container_name: fixmycampus_db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3306}:3306"
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-fmc_root_secret_2026}
      MYSQL_DATABASE: ${DB_DATABASE:-fixmycampus_db}
      MYSQL_USER: ${DB_USERNAME:-fmc_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-fmc_secure_password_2026}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - fixmycampus_network

  # ============================================================================
  # phpMyAdmin Service (Database Web GUI)
  # ============================================================================
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: fixmycampus_phpmyadmin
    restart: unless-stopped
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: database
      PMA_PORT: 3306
      UPLOAD_LIMIT: ${PMA_UPLOAD_LIMIT:-64M}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - fixmycampus_network

# ==============================================================================
# Volumes and Networks
# ==============================================================================
volumes:
  db_data:
    name: fixmycampus_db_data
    driver: local

networks:
  fixmycampus_network:
    name: fixmycampus_network
    driver: bridge
